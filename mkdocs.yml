site_name: vLLM Cluster Manager
site_description: Documentation for the vLLM Cluster Manager CLI and services.
site_url: https://sisl.github.io/vllmclustermanager/
repo_name: sisl/vllmclustermanager
repo_url: https://github.com/sisl/vllmclustermanager
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: teal

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Architecture: architecture.md
  - Operations: operations.md
