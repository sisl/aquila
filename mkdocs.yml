site_name: Aquila
site_description: Documentation for the Aquila GPU inference cluster manager.
site_url: https://sisl.github.io/vllmclustermanager/
repo_name: sisl/vllmclustermanager
repo_url: https://github.com/sisl/vllmclustermanager
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Source Sans 3
  logo: assets/img/aquila-logo.svg
  favicon: assets/img/aquila-icon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed

extra_css:
  - styles/extra.css

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Deployments: deployments.md
  - Gateway & Usage: gateway.md
  - API Reference: api-reference.md
  - CLI Reference: cli.md
  - Architecture: architecture.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
